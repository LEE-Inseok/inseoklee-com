<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .stage  { fill: #ffffff; stroke: #46627e; stroke-width: 1.5; }
    .meas   { fill: #fdf6ec; stroke: #b26a24; stroke-width: 1.5; }
    .outbox { fill: #f1f6f2; stroke: #4a7355; stroke-width: 1.5; }
    .chip   { fill: #eef2f6; stroke: #8aa0b5; stroke-width: 1; }
    .label  { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #46627e; }
    .mlabel { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #b26a24; }
    .olabel { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #4a7355; }
    .head   { font-size: 16px; font-weight: 600; fill: #232a33; }
    .body   { font-size: 12.5px; fill: #3c4552; }
    .small  { font-size: 11px; fill: #5c6673; }
    .title  { font-size: 22px; font-weight: 700; fill: #232a33; }
    .sub    { font-size: 12.5px; fill: #5c6673; }
    .flow   { stroke: #46627e; stroke-width: 1.5; fill: none; }
    .mflow  { stroke: #b26a24; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#46627e"/>
    </marker>
    <marker id="arrA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b26a24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1210" fill="#f8f8f5"/>

  <text x="60" y="52" class="title">Cradle-to-Gate Life-Cycle Assessment of Ru ALD</text>
  <text x="60" y="74" class="sub">Parallel case studies across deposition platforms · ISO 14044 framework · measurement-informed inventory</text>

  <!-- 1 GOAL & SCOPE -->
  <rect x="60" y="100" width="760" height="112" rx="3" class="stage"/>
  <text x="80" y="127" class="label">1 · GOAL AND SCOPE DEFINITION</text>
  <text x="80" y="152" class="head">System boundary and functional unit</text>
  <text x="80" y="174" class="body">Cradle-to-gate boundary: precursor synthesis (mining, refining, ligation, sublimation purification),</text>
  <text x="80" y="191" class="body">co-reactant, purge N₂, process electricity, exhaust abatement · Reference flow: 1 cm²·nm of dense film · Republic of Korea, 2026</text>

  <path d="M440,212 L440,240" class="flow" marker-end="url(#arr)"/>

  <!-- 2 INVENTORY: two columns -->
  <rect x="60" y="244" width="368" height="216" rx="3" class="stage"/>
  <text x="80" y="271" class="label">2A · PRECURSOR INVENTORY</text>
  <text x="80" y="296" class="head">Ru(EtCp)₂ life-cycle inventory</text>
  <rect x="80" y="312" width="328" height="36" rx="2" class="chip"/>
  <text x="92" y="329" class="body">Database proxy — generic organometallic process</text>
  <text x="92" y="343" class="small">screening-level lower bound</text>
  <rect x="80" y="354" width="328" height="36" rx="2" class="chip"/>
  <text x="92" y="371" class="body">Reconstructed synthesis route</text>
  <text x="92" y="385" class="small">stoichiometry · yield scenarios · scale-up correction</text>
  <rect x="80" y="396" width="328" height="36" rx="2" class="chip"/>
  <text x="92" y="413" class="body">Patent-derived process constraints</text>
  <text x="92" y="427" class="small">bounding values from manufacturer disclosures</text>
  <text x="80" y="450" class="small">PGM co-product allocation resolved at the unit-process level</text>

  <rect x="452" y="244" width="368" height="216" rx="3" class="meas"/>
  <text x="472" y="271" class="mlabel">2B · EXPERIMENTAL CAMPAIGN</text>
  <text x="472" y="296" class="head">In-situ process metrology (M1–M5)</text>
  <text x="472" y="322" class="body">M1 — electrical power profiling by process phase</text>
  <text x="472" y="342" class="body">M2 — precursor mass balance and utilization</text>
  <text x="472" y="362" class="body">M3 — carrier and purge gas accounting</text>
  <text x="472" y="382" class="body">M4 — deposition condition anchoring</text>
  <text x="472" y="402" class="body">M5 — exhaust capture and elemental mass closure</text>
  <text x="472" y="430" class="small">instrumentation added to scheduled deposition runs;</text>
  <text x="472" y="444" class="small">no dedicated precursor consumption</text>

  <path d="M244,460 L244,492" class="flow" marker-end="url(#arr)"/>
  <path d="M636,460 L636,492" class="mflow" marker-end="url(#arrA)"/>

  <!-- 3 SCENARIOS -->
  <rect x="60" y="496" width="760" height="168" rx="3" class="stage"/>
  <text x="80" y="523" class="label">3 · SCENARIO DEFINITION</text>
  <text x="80" y="548" class="head">From laboratory measurement to manufacturing-scale projection</text>
  <rect x="80" y="566" width="136" height="72" rx="2" class="meas"/>
  <text x="92" y="586" class="body">S0 / S0′</text>
  <text x="92" y="602" class="small">laboratory reactor,</text>
  <text x="92" y="616" class="small">flow-through and</text>
  <text x="92" y="630" class="small">stop-flow (measured)</text>
  <rect x="232" y="566" width="136" height="72" rx="2" class="chip"/>
  <text x="244" y="586" class="body">S1</text>
  <text x="244" y="602" class="small">recipe-level</text>
  <text x="244" y="616" class="small">optimization limit</text>
  <rect x="384" y="566" width="136" height="72" rx="2" class="chip"/>
  <text x="396" y="586" class="body">S2</text>
  <text x="396" y="602" class="small">300 mm</text>
  <text x="396" y="616" class="small">single-wafer tool</text>
  <rect x="536" y="566" width="136" height="72" rx="2" class="chip"/>
  <text x="548" y="586" class="body">S3 — reference</text>
  <text x="548" y="602" class="small">300 mm</text>
  <text x="548" y="616" class="small">batch furnace</text>
  <rect x="688" y="566" width="112" height="72" rx="2" class="chip"/>
  <text x="700" y="586" class="body">S4</text>
  <text x="700" y="602" class="small">spatial ALD,</text>
  <text x="700" y="616" class="small">throughput limit</text>

  <path d="M440,664 L440,692" class="flow" marker-end="url(#arr)"/>

  <!-- 4 COMPUTATION -->
  <rect x="60" y="696" width="760" height="128" rx="3" class="stage"/>
  <text x="80" y="723" class="label">4 · IMPACT CALCULATION</text>
  <text x="80" y="748" class="head">Life-cycle computation and uncertainty propagation</text>
  <text x="80" y="772" class="body">Brightway 2.5 with ecoinvent 3.12 (cut-off) · pedigree-based Monte Carlo simulation (n = 20,000)</text>
  <text x="80" y="792" class="body">Sensitivity analyses: co-product allocation · electricity mix (present grid, decarbonization target, PPA) ·</text>
  <text x="80" y="812" class="body">precursor utilization · inventory data source</text>

  <path d="M440,824 L440,852" class="flow" marker-end="url(#arr)"/>

  <!-- 5 INTERPRETATION -->
  <rect x="60" y="856" width="760" height="118" rx="3" class="stage"/>
  <text x="80" y="883" class="label">5 · INTERPRETATION</text>
  <text x="80" y="908" class="head">Impact assessment and interpretation</text>
  <text x="80" y="932" class="body">Climate change (GWP100, IPCC 2021) and mineral resource scarcity (crustal scarcity indicator) assessed in parallel</text>
  <text x="80" y="952" class="body">Energy- and material-dominated regimes delineated as a function of platform scale, electricity mix, and allocation method</text>
  <text x="80" y="968" class="small">analysis decisions specified a priori, before the experimental campaign</text>

  <path d="M440,974 L440,1002" class="flow" marker-end="url(#arr)"/>

  <!-- 6 OUTPUTS -->
  <rect x="60" y="1006" width="760" height="118" rx="3" class="outbox"/>
  <text x="80" y="1033" class="olabel">6 · REPORTING</text>
  <text x="80" y="1058" class="head">Manuscript and reproducible analysis archive</text>
  <text x="80" y="1082" class="body">Journal manuscript with complete figure and table set generated from a single computational workflow</text>
  <text x="80" y="1102" class="body">All results reproducible from archived inventory data without proprietary database access</text>

  <text x="60" y="1168" class="small">Lee Inseok · 2026 · Inventory model and computational workflow complete; manuscript in preparation; experimental campaign scheduled</text>
</svg>
